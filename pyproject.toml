[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "zeropoint-mcp"
version = "1.0.0"
description = "ZeroPoint Model Context Protocol server — filesystem, webtools, ADB, Android, IT automation, OSINT, and control-plane orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ZeroPoint" }]

dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
    # Ray
    "ray[default]>=2.34.0",
    "ray[serve]>=2.34.0",
    # Android
    "uiautomator2>=3.0",
    "appium-python-client>=3.1",
    # Observability
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    # MCP
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.0",
]
kali = [
    "python-nmap>=0.7",
    "scapy>=2.5",
    "paramiko>=3.4",
    "impacket>=0.12",
]
osint = [
    "shodan>=1.31",
    "dnspython>=2.6",
    "whois>=0.9",
    "tldextract>=5.0",
    "tweepy>=4.14",
]

[project.scripts]
zeropoint-server = "zeropoint.server:main"
zeropoint-control = "zeropoint.control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zeropoint*", "android*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
