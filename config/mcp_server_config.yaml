server:
  host: "0.0.0.0"
  port: 8765
  auth:
    enabled: true
    token_env: "MCP_AUTH_TOKEN"

observability:
  prometheus:
    enabled: true
    port: 9090

tools:
  filesystem:
    enabled: true
    module: zeropoint.tools.filesystem
    class: FilesystemTool
    config:
      allowed_roots:
        - "C:\\Zeropoint"
      read_allowed_roots:
        - "C:\\Zeropoint"
      write_allowed_roots:
        - "C:\\Zeropoint"
      list_allowed_roots:
        - "C:\\Zeropoint"
      deny_patterns:
        - "*\\.env"
        - "*\\*.key"
        - "*\\*.pem"
      allow_symlinks: false
      allow_write: true
  webtools:
    enabled: true
    module: zeropoint.tools.webtools
    class: WebtoolsTool
    config:
      timeout_seconds: 30
      max_response_size_mb: 16
      follow_redirects: true
      max_redirects: 5
      rate_limit:
        requests_per_minute: 60
        burst: 10
  adb:
    enabled: true
    module: zeropoint.tools.adb
    class: AdbTool
    config:
      adb_binary: "C:\\platform-tools\\adb.exe"
      adb_server_host: "127.0.0.1"
      adb_server_port: 5037
  android:
    enabled: true
    module: zeropoint.tools.android.tool
    class: AndroidTool
    config:
      screenshot_dir: "C:\\ZeroPoint\\data\\camnet\\screenshots"
      video_dir: "C:\\ZeroPoint\\data\\camnet\\recordings"
      camnet: {}
